name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  track:
    name: track (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/track
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw -B verify